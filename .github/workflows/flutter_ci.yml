name: Flutter Enterprise CI

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - name: 📚 Checkout repository
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # Pinned: an unpinned "latest stable" analyzer disagreed with local
          # builds and turned main red (#123/#125). Bump on purpose, not by drift.
          flutter-version: '3.47.7'
          cache: true

      - name: 📝 Prepare environment files for CI
        run: |
          cp .env.example .env.dev
          cp .env.example .env.prod

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: ⚙️ Generate Localization (l10n)
        run: flutter gen-l10n

      - name: 🔍 Verify Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: 🕵️ Analyze Code
        run: flutter analyze

      - name: 🧱 Enforce Feature Isolation (no new cross-feature imports)
        run: bash tools/check_feature_isolation.sh

      - name: 🧪 Run Tests
        run: flutter test
